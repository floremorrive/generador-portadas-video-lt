<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generador de Portadas de Video — La Tribuna</title>
<link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <header>
    <h1>Generador de Portadas de Video</h1>
    <p class="subtitulo">La Tribuna · Reels y videos 1080×1920</p>
  </header>

  <main>
    <section class="panel-controles">
      <div class="campo">
        <label for="input-foto">Fotograma del video</label>
        <input type="file" id="input-foto" accept="image/*">
      </div>

      <div class="campo">
        <label for="input-zoom">Zoom (arrastre la imagen en la vista previa para moverla)</label>
        <input type="range" id="input-zoom" min="1" max="2.5" step="0.01" value="1">
      </div>

      <div class="campo">
        <label for="input-categoria">Categoría</label>
        <select id="input-categoria"></select>
        <input type="text" id="input-categoria-otra" placeholder="Escriba la categoría" maxlength="40" hidden>
      </div>

      <div class="campo">
        <label for="input-titular">Titular (máximo 3 líneas)</label>
        <textarea id="input-titular" rows="4" maxlength="140">Estados Unidos anuncia nuevas medidas comerciales</textarea>
      </div>

      <div class="campo">
        <label>Textura</label>
        <div class="segmentado">
          <label><input type="radio" name="textura" value="lineas" checked> Líneas</label>
          <label><input type="radio" name="textura" value="gotas"> Gotas</label>
          <label><input type="radio" name="textura" value="ninguna"> Ninguna</label>
        </div>
        <label for="input-opacidad">Opacidad: <span id="opacidad-valor">15%</span></label>
        <input type="range" id="input-opacidad" min="0" max="40" step="1" value="15">
      </div>

      <div class="campo">
        <label class="check"><input type="checkbox" id="input-degradado"> Degradado de contraste (negro suave abajo)</label>
        <label class="check"><input type="checkbox" id="input-guias" checked> Mostrar guías (no salen en el PNG)</label>
      </div>

      <div class="botones">
        <button id="btn-descargar" type="button">Descargar portada (PNG 1080×1920)</button>
      </div>

      <p id="estado" class="estado"></p>
    </section>

    <section class="panel-preview">
      <div id="preview-wrap" class="preview-wrap">
        <canvas id="canvas-preview"></canvas>
      </div>
    </section>
  </main>

  <canvas id="canvas-export" style="display:none"></canvas>

  <script>document.write('<script src="js/render.js?v=' + Date.now() + '"><\/script>');</script>
  <script>document.write('<script src="js/app.js?v=' + Date.now() + '"><\/script>');</script>
</body>
</html>
